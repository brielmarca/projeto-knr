name: Windows desktop build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-windows-desktop:
    name: Build Windows x64 desktop app
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_API_URL: ${{ vars.VITE_API_URL }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify existing frontend
        run: npm run check

      - name: Install snapshot contract dependencies
        run: npm ci --prefix contracts

      - name: Verify snapshot contract
        run: npm test --prefix contracts

      - name: Check native formatting
        run: cargo fmt --manifest-path native/Cargo.toml --check

      - name: Check desktop formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Test native memory collector on Windows
        run: cargo test --manifest-path native/Cargo.toml --locked

      - name: Test desktop command and IPC permissions
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Lint native collector
        run: cargo clippy --manifest-path native/Cargo.toml --locked --all-targets -- -D warnings

      - name: Lint desktop command
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build NSIS installer
        run: npm run desktop:build

      - name: Upload Windows installer and executable
        uses: actions/upload-artifact@v4
        with:
          name: krz-boost-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/krz-boost.exe

  test-linux-unsupported:
    name: Test Linux unsupported-platform IPC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test native unsupported-platform behavior
        run: cargo test --manifest-path native/Cargo.toml --locked

      - name: Test desktop command and IPC permissions
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
