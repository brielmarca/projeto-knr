[package]
name = "krz-telemetry"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Registry", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = "1"
