[package]
name = "krz-boost"
version = "0.1.0"
description = "KRZ Boost desktop shell"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "=2.7.0", features = [] }

[dependencies]
tauri = { version = "=2.12.0", default-features = false, features = ["wry"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
